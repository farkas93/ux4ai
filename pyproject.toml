[project]
name = "aipm-toolkit"
version = "0.1.0"
description = "AIPM Toolkit workshop workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "argon2-cffi==25.1.0",
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "fpdf2==2.8.4",
  "gradio==5.44.1",
  "python-multipart==0.0.20",
  "pydantic-settings==2.10.1",
  "plotly==6.3.1",
  "psycopg[binary]==3.2.10",
  "sqlalchemy==2.0.43",
  "uvicorn==0.35.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aipm_toolkit*"]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "httpx==0.28.1",
  "sqlite-utils==3.38",
]
e2e = [
  "playwright==1.55.0",
  "pytest-playwright==0.7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "postgres: requires a PostgreSQL database configured through AIPM_TEST_DATABASE_URL",
  "e2e: requires a running AIPM server and Playwright Chromium",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["user_server.py", "dashboard_server.py", "generate_summary_report.py", "per_student_report.py", "convert_reports_to_pdf.py"]
