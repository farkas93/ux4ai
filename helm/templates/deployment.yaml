{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: public tunnel state is process-local" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aipm.fullname" . }}
  labels:
    {{- include "aipm.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aipm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aipm.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate-and-bootstrap
          image: {{ include "aipm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              python - <<'PY'
              import os, time
              from sqlalchemy import create_engine, text
              engine = create_engine(os.environ["AIPM_DATABASE_URL"])
              for attempt in range(60):
                  try:
                      with engine.connect() as connection:
                          connection.execute(text("SELECT 1"))
                      break
                  except Exception:
                      if attempt == 59:
                          raise
                      time.sleep(2)
              PY
              alembic upgrade head
              python -c 'import os; from aipm_toolkit.seed import bootstrap_instructor; bootstrap_instructor(os.environ["AIPM_INSTRUCTOR_USERNAME"], os.environ["AIPM_INSTRUCTOR_PASSWORD"], os.getenv("AIPM_COURSE_NAME", "AIPM Workshop"))'
          envFrom:
            - configMapRef:
                name: {{ include "aipm.fullname" . }}-config
          env:
            - name: AIPM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseUrlKey }}
            - name: AIPM_INSTRUCTOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.instructorUsernameKey }}
            - name: AIPM_INSTRUCTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.instructorPasswordKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: aipm
          image: {{ include "aipm.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          envFrom:
            - configMapRef:
                name: {{ include "aipm.fullname" . }}-config
          env:
            - name: AIPM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseUrlKey }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: gradio-cache
              mountPath: /home/appuser/.cache
            - name: gradio-certificate
              mountPath: /app/.gradio
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: gradio-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: gradio-certificate
          emptyDir:
            sizeLimit: 1Mi
