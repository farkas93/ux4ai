services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aipm
      POSTGRES_USER: aipm
      POSTGRES_PASSWORD: aipm-local-development-only
    volumes:
      - aipm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm -d aipm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIPM_DATABASE_URL: postgresql+psycopg://aipm:aipm-local-development-only@db:5432/aipm
      AIPM_COOKIE_SECURE: "false"
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aipm_postgres:
