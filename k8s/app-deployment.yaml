apiVersion: apps/v1
kind: Deployment
metadata:
  name: aipm-app
spec:
  replicas: 1
  # The share tunnel is process-local; keep one pod and avoid overlap during restarts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aipm-app
  template:
    metadata:
      labels:
        app: aipm-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/REPLACE_WITH_YOUR_ORG/aipm-toolkit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860
          envFrom:
            - configMapRef:
                name: aipm-config
          env:
            - name: AIPM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aipm-secrets
                  key: AIPM_DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: gradio-cache
              mountPath: /home/appuser/.cache
            - name: gradio-certificate
              mountPath: /app/.gradio
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: gradio-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: gradio-certificate
          emptyDir:
            sizeLimit: 1Mi
