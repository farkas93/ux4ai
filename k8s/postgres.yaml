apiVersion: v1
kind: Service
metadata:
  name: aipm-postgres
spec:
  selector:
    app: aipm-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aipm-postgres
spec:
  serviceName: aipm-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aipm-postgres
  template:
    metadata:
      labels:
        app: aipm-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: aipm-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aipm-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "aipm", "-d", "aipm"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aipm", "-d", "aipm"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aipm", "-d", "aipm"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
