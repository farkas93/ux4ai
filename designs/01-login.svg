<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="980" viewBox="0 0 1530 980" role="img" aria-labelledby="title desc"><title id="title">Login: desktop and mobile design proposal</title><desc id="desc">Static review mockup, not a functioning interface. Desktop at left and mobile at right.</desc><style>text {font-family: Arial, sans-serif;} </style><rect x="0" y="0" width="1530" height="980" rx="0" fill="#ecf1f6" stroke="none"/><text x="24" y="31" font-size="12" fill="#69798c" font-weight="600">LOGIN · DESKTOP</text><text x="1150" y="31" font-size="12" fill="#69798c" font-weight="600">MOBILE · STACKED LAYOUT</text><rect x="24" y="56" width="1090" height="874" rx="16" fill="#f7f9fc" stroke="#e0e7ef"/><text x="72" y="114" font-size="20" fill="#243449" font-weight="700">AI Product Toolkit</text><text x="72" y="264" font-size="11" fill="#0f766e" font-weight="700">AI PRODUCT MANAGEMENT · LEARNING WORKSPACE</text><text x="72" y="327" font-size="36" fill="#243449" font-weight="400">Find the value.</text><text x="72" y="374" font-size="36" fill="#243449" font-weight="400">Question the assumptions.</text><text x="72" y="421" font-size="36" fill="#243449" font-weight="400">Decide what to test.</text><text x="72" y="510" font-size="17" fill="#69798c" font-weight="400">A student workspace to shape a value hypothesis</text><text x="72" y="538" font-size="17" fill="#69798c" font-weight="400">and build a backlog of testable ideas.</text><text x="72" y="627" font-size="14" fill="#243449" font-weight="400">01  Define who you help and why it matters</text><text x="72" y="667" font-size="14" fill="#243449" font-weight="400">02  Explore dimensions, safety, and improvement</text><text x="72" y="707" font-size="14" fill="#243449" font-weight="400">03  Turn questions into hypotheses</text><rect x="649" y="248" width="401" height="422" rx="12" fill="white" stroke="#e0e7ef"/><text x="669" y="280" font-size="17" fill="#243449" font-weight="650">Welcome to your workspace</text><text x="669" y="306" font-size="13" fill="#69798c" font-weight="400">Use your course team or instructor account.</text><text x="677" y="358" font-size="13" fill="#243449" font-weight="600">Username</text><rect x="677" y="370" width="345" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="689" y="395" font-size="13" fill="#69798c" font-weight="400">Your team alias</text><text x="677" y="451" font-size="13" fill="#243449" font-weight="600">Password</text><rect x="677" y="463" width="345" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="689" y="488" font-size="13" fill="#69798c" font-weight="400">••••••••••••</text><rect x="677" y="537" width="345" height="38" rx="7" fill="#0f766e" stroke="#0f766e"/><text x="691" y="561" font-size="13" fill="white" font-weight="600">Sign in</text><text x="677" y="623" font-size="13" fill="#69798c" font-weight="400">Need access? Ask your instructor.</text><rect x="1150" y="56" width="350" height="874" rx="20" fill="#f7f9fc" stroke="#e0e7ef"/><text x="1170" y="103" font-size="20" fill="#243449" font-weight="700">AI Product Toolkit</text><text x="1170" y="183" font-size="26" fill="#243449" font-weight="400">Find value. Build your</text><text x="1170" y="217" font-size="26" fill="#243449" font-weight="400">hypothesis backlog.</text><text x="1170" y="275" font-size="14" fill="#69798c" font-weight="400">Explore questions and assumptions</text><text x="1170" y="299" font-size="14" fill="#69798c" font-weight="400">with your team, then decide what</text><text x="1170" y="323" font-size="14" fill="#69798c" font-weight="400">to test next.</text><rect x="1170" y="374" width="310" height="350" rx="12" fill="white" stroke="#e0e7ef"/><text x="1190" y="406" font-size="17" fill="#243449" font-weight="650">Sign in</text><text x="1190" y="448" font-size="13" fill="#243449" font-weight="600">Username</text><rect x="1190" y="460" width="270" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="1202" y="485" font-size="13" fill="#69798c" font-weight="400">Your team alias</text><text x="1190" y="544" font-size="13" fill="#243449" font-weight="600">Password</text><rect x="1190" y="556" width="270" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="1202" y="581" font-size="13" fill="#69798c" font-weight="400">••••••••••••</text><rect x="1190" y="625" width="270" height="38" rx="7" fill="#0f766e" stroke="#0f766e"/><text x="1204" y="649" font-size="13" fill="white" font-weight="600">Sign in</text><text x="1170" y="768" font-size="13" fill="#69798c" font-weight="400">Need access? Ask your instructor.</text><text x="24" y="961" font-size="11" fill="#69798c" font-weight="400">DRAFT 01 · Review layout and learning flow before implementation. Sample content only.</text></svg>