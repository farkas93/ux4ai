es reveal repeat issues?</text><rect x="774" y="534" width="296" height="38" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="786" y="558" font-size="12" fill="#69798c" font-weight="400">Question ▾  What needs exploring?</text><rect x="774" y="583" width="145" height="38" rx="7" fill="#0f766e" stroke="#0f766e"/><text x="788" y="607" font-size="13" fill="white" font-weight="600">Add to backlog</text><rect x="754" y="680" width="170" height="38" rx="7" fill="#0f766e" stroke="#0f766e"/><text x="768" y="704" font-size="13" fill="white" font-weight="600">Save learning loop</text><rect x="1170" y="278" width="310" height="132" rx="12" fill="white" stroke="#e0e7ef"/><text x="1190" y="310" font-size="17" fill="#243449" font-weight="650">Your learning loop</text><text x="1190" y="344" font-size="13" fill="#243449" font-weight="400">Review failed chats and propose</text><text x="1190" y="367" font-size="13" fill="#243449" font-weight="400">better clarification prompts.</text><rect x="1170" y="424" width="310" height="200" rx="12" fill="white" stroke="#e0e7ef"/><text x="1190" y="456" font-size="17" fill="#243449" font-weight="650">AI summarizes evidence?</text><text x="1190" y="484" font-size="12" fill="#0f766e" font-weight="400">● Yes  ○ Partly  ○ No  ○ Unknown</text><text x="1190" y="532" font-size="13" fill="#243449" font-weight="600">Explanation</text><rect x="1190" y="544" width="270" height="46" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="1202" y="569" font-size="13" fill="#69798c" font-weight="400">We review summaries of failed chats.</text><rect x="1170" y="638" width="310" height="195" rx="12" fill="white" stroke="#e0e7ef"/><text x="1190" y="670" font-size="17" fill="#243449" font-weight="650">Questions &amp; assumptions</text><text x="1190" y="688" font-size="14" fill="#243449" font-weight="650">Questions &amp; assumptions</text><rect x="1190" y="703" width="270" height="51" rx="7" fill="#f2f7f6" stroke="#dfebe8"/><text x="1202" y="724" font-size="10" fill="#0f7