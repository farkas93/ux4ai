<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="980" viewBox="0 0 1530 980" role="img" aria-labelledby="title desc"><title id="title">Project Setup: desktop and mobile design proposal</title><desc id="desc">Static review mockup, not a functioning interface. Desktop at left and mobile at right.</desc><style>text {font-family: Arial, sans-serif;} </style><rect x="0" y="0" width="1530" height="980" rx="0" fill="#ecf1f6" stroke="none"/><text x="24" y="31" font-size="12" fill="#69798c" font-weight="600">PROJECT SETUP · DESKTOP</text><text x="1150" y="31" font-size="12" fill="#69798c" font-weight="600">MOBILE · STACKED LAYOUT</text><rect x="24" y="56" width="1090" height="874" rx="16" fill="#f7f9fc" stroke="#e0e7ef"/><rect x="24" y="56" width="1090" height="64" rx="16" fill="white" stroke="#e0e7ef"/><text x="44" y="96" font-size="18" fill="#243449" font-weight="700">AI Product Toolkit</text><rect x="272" y="73" width="205" height="32" rx="6" fill="#f8fafc" stroke="#e0e7ef"/><text x="284" y="94" font-size="13" fill="#243449" font-weight="400">convincer.io                 ▾</text><text x="498" y="94" font-size="13" fill="#0f766e" font-weight="600">+ Product</text><text x="936" y="94" font-size="13" fill="#243449" font-weight="400">EN ▾</text><text x="995" y="94" font-size="13" fill="#243449" font-weight="400">cais-26 ▾</text><text x="46" y="157" font-size="10" fill="#69798c" font-weight="700">WORKSPACE</text><rect x="36" y="164" width="167" height="35" rx="7" fill="#e2f2ee" stroke="#e2f2ee"/><text x="48" y="187" font-size="13" fill="#0f766e" font-weight="650">Project Setup</text><text x="48" y="230" font-size="13" fill="#69798c" font-weight="400">Assessment</text><text x="48" y="273" font-size="13" fill="#69798c" font-weight="400">AI Safety</text><text x="48" y="316" font-size="13" fill="#69798c" font-weight="400">Self-Improvement</text><text x="48" y="359" font-size="13" fill="#69798c" font-weight="400">Backlog Creator</text><text x="48" y="402" font-size="13" fill="#69798c" font-weight="400">Prioritization</text><text x="48" y="445" font-size="13" fill="#69798c" font-weight="400">Summary &amp; Export</text><text x="48" y="488" font-size="13" fill="#69798c" font-weight="400">Project History</text><text x="46" y="595" font-size="11" fill="#69798c" font-weight="400">Learning tools</text><text x="232" y="164" font-size="26" fill="#243449" font-weight="700">Project Setup</text><text x="232" y="193" font-size="14" fill="#69798c" font-weight="400">Start with who you help and the change you expect.</text><text x="970" y="164" font-size="12" fill="#0f766e" font-weight="400">● Saved</text><rect x="1150" y="56" width="350" height="874" rx="20" fill="#f7f9fc" stroke="#e0e7ef"/><text x="1170" y="92" font-size="17" fill="#243449" font-weight="700">AI Product Toolkit</text><text x="1460" y="92" font-size="19" fill="#243449" font-weight="400">☰</text><rect x="1170" y="111" width="310" height="36" rx="7" fill="white" stroke="#e0e7ef"/><text x="1183" y="134" font-size="13" fill="#243449" font-weight="400">convincer.io                              ▾</text><rect x="1170" y="157" width="310" height="36" rx="7" fill="#e2f2ee" stroke="#e2f2ee"/><text x="1183" y="180" font-size="13" fill="#0f766e" font-weight="600">Project Setup  ▾</text><text x="1170" y="229" font-size="23" fill="#243449" font-weight="700">Project Setup</text><text x="1170" y="254" font-size="12" fill="#0f766e" font-weight="400">● Saved</text><rect x="232" y="220" width="425" height="255" rx="12" fill="white" stroke="#e0e7ef"/><text x="252" y="252" font-size="17" fill="#243449" font-weight="650">1 · Product idea</text><text x="252" y="278" font-size="13" fill="#69798c" font-weight="400">Keep it brief. You can refine it later.</text><text x="252" y="311" font-size="13" fill="#243449" font-weight="600">Short description</text><rect x="252" y="323" width="385" height="76" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="264" y="348" font-size="13" fill="#69798c" font-weight="400">Clarify support requests before routing.</text><text x="252" y="426" font-size="13" fill="#243449" font-weight="600">AI product type</text><rect x="252" y="438" width="385" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="264" y="463" font-size="13" fill="#69798c" font-weight="400">Feature ▾</text><rect x="675" y="220" width="415" height="255" rx="12" fill="white" stroke="#e0e7ef"/><text x="695" y="252" font-size="17" fill="#243449" font-weight="650">2 · User &amp; problem</text><text x="695" y="285" font-size="13" fill="#243449" font-weight="600">Who is it for?</text><rect x="695" y="297" width="375" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="707" y="322" font-size="13" fill="#69798c" font-weight="400">Support teams</text><text x="695" y="367" font-size="13" fill="#243449" font-weight="600">Job to be done</text><rect x="695" y="379" width="375" height="70" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="707" y="404" font-size="13" fill="#69798c" font-weight="400">Understand the customer&#x27;s real request.</text><rect x="232" y="495" width="858" height="268" rx="12" fill="white" stroke="#e0e7ef"/><text x="252" y="527" font-size="17" fill="#243449" font-weight="650">3 · Main value hypothesis</text><text x="252" y="553" font-size="13" fill="#69798c" font-weight="400">What outcome should improve for this user?</text><text x="252" y="590" font-size="17" fill="#243449" font-weight="400">If we help support teams clarify requests before routing,</text><text x="252" y="620" font-size="17" fill="#243449" font-weight="400">we expect fewer hand-offs while maintaining customer control.</text><text x="252" y="709" font-size="13" fill="#69798c" font-weight="400">Prototype link (optional)   figma.com/…</text><rect x="232" y="788" width="172" height="38" rx="7" fill="#0f766e" stroke="#0f766e"/><text x="246" y="812" font-size="13" fill="white" font-weight="600">Save product setup</text><rect x="1170" y="278" width="310" height="207" rx="12" fill="white" stroke="#e0e7ef"/><text x="1190" y="310" font-size="17" fill="#243449" font-weight="650">1 · Product idea</text><text x="1190" y="339" font-size="13" fill="#243449" font-weight="600">Short description</text><rect x="1190" y="351" width="270" height="58" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="1202" y="376" font-size="13" fill="#69798c" font-weight="400">Clarify support requests</text><text x="1190" y="433" font-size="13" fill="#243449" font-weight="600">AI product type</text><rect x="1190" y="445" width="270" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="1202" y="470" font-size="13" fill="#69798c" font-weight="400">Feature ▾</text><rect x="1170" y="499" width="310" height="165" rx="12" fill="white" stroke="#e0e7ef"/><text x="1190" y="531" font-size="17" fill="#243449" font-weight="650">2 · User &amp; problem</text><text x="1190" y="559" font-size="13" fill="#243449" font-weight="600">Who is it for?</text><rect x="1190" y="571" width="270" height="42" rx="7" fill="#f9fbfd" stroke="#e0e7ef"/><text x="1202" y="596" font-size="13" fill="#69798c" font-weight="400">Support teams</text><rect x="1170" y="678" width="310" height="156" rx="12" fill="white" stroke="#e0e7ef"/><text x="1190" y="710" font-size="17" fill="#243449" font-weight="650">3 · Value hypothesis</text><text x="1190" y="745" font-size="13" fill="#243449" font-weight="400">If we help support teams clarify…</text><text x="1190" y="768" font-size="13" fill="#243449" font-weight="400">we expect fewer hand-offs…</text><rect x="1170" y="857" width="310" height="38" rx="7" fill="#0f766e" stroke="#0f766e"/><text x="1184" y="881" font-size="13" fill="white" font-weight="600">Save product setup</text><text x="24" y="961" font-size="11" fill="#69798c" font-weight="400">DRAFT 01 · Review layout and learning flow before implementation. Sample content only.</text></svg>