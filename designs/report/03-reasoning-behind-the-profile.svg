<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">Reasoning behind the profile — report design</title><desc id="desc">A4 portrait report concept, with illustrative student-authored content.</desc><style>text {font-family: Arial, sans-serif;}</style><rect width="794" height="1123" fill="white"/><text x="56" y="43" font-size="10" fill="#0b766c" font-weight="700">AI PRODUCT TOOLKIT</text><text x="562" y="43" font-size="10" fill="#627580" font-weight="400">convincer.io · Team cais-26</text><path d="M56 59H738" stroke="#dce4e6"/><text x="56" y="111" font-size="30" fill="#192c39" font-weight="700">Reasoning behind the profile</text><text x="56" y="140" font-size="13" fill="#627580" font-weight="400">Student comments and uncertainties, grouped by rubric.</text><text x="56" y="186" font-size="11" fill="#0b766c" font-weight="700">03 / ASSESSMENT REASONING</text><text x="56" y="225" font-size="22" fill="#192c39" font-weight="700">Conversational interaction</text><text x="651" y="225" font-size="17" fill="#0b766c" font-weight="700">1.5 / 5</text><text x="56" y="256" font-size="12" fill="#627580" font-weight="400">Guided 0 ↔ Open-ended 5</text><text x="56" y="301" font-size="11" fill="#0b766c" font-weight="700">TEAM&#x27;S REASONING</text><text x="56" y="336" font-size="15" fill="#192c39" font-weight="400">The main experience is a guided comparison between a CV and a job</text><text x="56" y="361" font-size="15" fill="#192c39" font-weight="400">description. AI does not need to lead an open-ended conversation.</text><text x="56" y="386" font-size="15" fill="#192c39" font-weight="400">Short clarifying questions may help users explain relevant experience</text><text x="56" y="411" font-size="15" fill="#192c39" font-weight="400">without making the process feel like an interview.</text><rect x="56" y="458" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="482" font-size="10" fill="#0b766c" font-weight="700">QUESTION</text><text x="72" y="506" font-size="14" fill="#192c39" font-weight="400">Will users understand why a clarification is being asked?</text><text x="72" y="528" font-size="11" fill="#627580" font-weight="400">Assessment · Conversational interaction → H1</text><rect x="56" y="558" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="582" font-size="10" fill="#0b766c" font-weight="700">ASSUMPTION</text><text x="72" y="606" font-size="14" fill="#192c39" font-weight="400">A short guided flow is less effort than an open-ended chat.</text><text x="72" y="628" font-size="11" fill="#627580" font-weight="400">Assessment · Conversational interaction → not yet formulated as a hypothesis</text><path d="M56 686H738" stroke="#dce4e6"/><text x="56" y="729" font-size="22" fill="#192c39" font-weight="700">Autonomy</text><text x="651" y="729" font-size="17" fill="#0b766c" font-weight="700">2.0 / 5</text><text x="56" y="772" font-size="11" fill="#0b766c" font-weight="700">TEAM&#x27;S REASONING</text><text x="56" y="807" font-size="15" fill="#192c39" font-weight="400">The tool proposes changes but does not submit an application.</text><text x="56" y="832" font-size="15" fill="#192c39" font-weight="400">Users should approve every edit and be able to restore the original.</text><text x="56" y="857" font-size="15" fill="#192c39" font-weight="400">This keeps consequential decisions with the applicant.</text><rect x="56" y="910" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="934" font-size="10" fill="#0b766c" font-weight="700">QUESTION</text><text x="72" y="958" font-size="14" fill="#192c39" font-weight="400">Can applicants reliably spot inaccurate suggested changes?</text><text x="72" y="980" font-size="11" fill="#627580" font-weight="400">Assessment · Autonomy → H2</text><path d="M56 1067H738" stroke="#dce4e6"/><text x="56" y="1091" font-size="10" fill="#627580" font-weight="400">Learning report · Intended product behavior, not proven product quality</text><text x="705" y="1091" font-size="11" fill="#0b766c" font-weight="700">03</text></svg>