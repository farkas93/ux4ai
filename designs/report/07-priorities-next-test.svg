<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">Priorities &amp; next test — report design</title><desc id="desc">A4 portrait report concept, with illustrative student-authored content.</desc><style>text {font-family: Arial, sans-serif;}</style><rect width="794" height="1123" fill="white"/><text x="56" y="43" font-size="10" fill="#0b766c" font-weight="700">AI PRODUCT TOOLKIT</text><text x="562" y="43" font-size="10" fill="#627580" font-weight="400">convincer.io · Team cais-26</text><path d="M56 59H738" stroke="#dce4e6"/><text x="56" y="111" font-size="30" fill="#192c39" font-weight="700">Priorities &amp; next test</text><text x="56" y="140" font-size="13" fill="#627580" font-weight="400">Matrix first, then identifiable hypotheses and an explanation of the order.</text><text x="56" y="187" font-size="11" fill="#0b766c" font-weight="700">07 / CHOOSE WHAT TO LEARN NEXT</text><path d="M106 505V243M106 505H688" fill="none" stroke="#9aaeb9"/><rect x="107" y="244" width="280" height="128" rx="6" fill="#edf6f2" stroke="none"/><text x="126" y="270" font-size="10" fill="#0b766c" font-weight="700">HIGH RISK · LITTLE EVIDENCE</text><circle cx="224" cy="285" r="6" fill="#0b766c"/><text x="236" y="289" font-size="12" fill="#192c39" font-weight="600">H2</text><circle cx="340" cy="320" r="6" fill="#0b766c"/><text x="352" y="324" font-size="12" fill="#192c39" font-weight="600">H3</text><circle cx="515" cy="425" r="6" fill="#0b766c"/><text x="527" y="429" font-size="12" fill="#192c39" font-weight="600">H1</text><circle cx="456" cy="359" r="6" fill="#0b766c"/><text x="468" y="363" font-size="12" fill="#192c39" font-weight="600">H4</text><text x="311" y="541" font-size="12" fill="#627580" font-weight="400">Evidence available →</text><text x="56" y="575" font-size="12" fill="#627580" font-weight="400">Priority = risk if wrong + (10 − evidence). Equal scores are tied.</text><rect x="56" y="617" width="682" height="151" rx="6" fill="#f4f7f7" stroke="none"/><text x="76" y="646" font-size="11" fill="#0b766c" font-weight="700">FIRST TO DISCUSS · H2</text><text x="76" y="678" font-size="20" fill="#192c39" font-weight="700">Accuracy of suggested edits</text><text x="76" y="708" font-size="14" fill="#192c39" font-weight="400">Priority 17/20 = risk 9 + uncertainty 8 (10 − evidence 2).</text><text x="76" y="731" font-size="14" fill="#192c39" font-weight="400">High consequence if inaccurate edits are accepted; little evidence yet.</text><text x="56" y="817" font-size="11" fill="#0b766c" font-weight="700">NEXT EXPERIMENT — IF RECORDED BY THE TEAM</text><text x="56" y="852" font-size="14" fill="#192c39" font-weight="400">Prototype walkthrough with deliberately inaccurate suggestions.</text><text x="56" y="878" font-size="14" fill="#192c39" font-weight="400">Metric: proportion of inaccurate edits participants identify.</text><text x="56" y="904" font-size="14" fill="#192c39" font-weight="400">Success criterion: set by the team before running the test.</text><text x="56" y="930" font-size="14" fill="#192c39" font-weight="400">If no experiment is saved, display: No next experiment recorded.</text><text x="56" y="995" font-size="12" fill="#627580" font-weight="400">A discussion priority is not a calibrated risk estimate or readiness score.</text><path d="M56 1067H738" stroke="#dce4e6"/><text x="56" y="1091" font-size="10" fill="#627580" font-weight="400">Learning report · Intended product behavior, not proven product quality</text><text x="705" y="1091" font-size="11" fill="#0b766c" font-weight="700">07</text></svg>