<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">AI Safety — report design</title><desc id="desc">A4 portrait report concept, with illustrative student-authored content.</desc><style>text {font-family: Arial, sans-serif;}</style><rect width="794" height="1123" fill="white"/><text x="56" y="43" font-size="10" fill="#0b766c" font-weight="700">AI PRODUCT TOOLKIT</text><text x="562" y="43" font-size="10" fill="#627580" font-weight="400">convincer.io · Team cais-26</text><path d="M56 59H738" stroke="#dce4e6"/><text x="56" y="111" font-size="30" fill="#192c39" font-weight="700">AI Safety</text><text x="56" y="140" font-size="13" fill="#627580" font-weight="400">Capture the team&#x27;s concerns, rather than a numeric claim of safety.</text><text x="56" y="187" font-size="11" fill="#0b766c" font-weight="700">04 / SAFETY EXPLORATION</text><text x="56" y="223" font-size="14" fill="#627580" font-weight="400">Questions below describe uncertainties the team identified.</text><text x="56" y="246" font-size="14" fill="#627580" font-weight="400">They are not a safety rating or evidence that the risks are controlled.</text><text x="56" y="309" font-size="21" fill="#192c39" font-weight="700">Harms</text><text x="56" y="337" font-size="12" fill="#627580" font-weight="400">Plausible failures and the people affected</text><rect x="56" y="365" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="389" font-size="10" fill="#0b766c" font-weight="700">QUESTION</text><text x="72" y="413" font-size="14" fill="#192c39" font-weight="400">Could a proposed edit invent experience the applicant does not have?</text><text x="72" y="435" font-size="11" fill="#627580" font-weight="400">AI Safety · Harms → H2</text><rect x="56" y="466" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="490" font-size="10" fill="#0b766c" font-weight="700">ASSUMPTION</text><text x="72" y="514" font-size="14" fill="#192c39" font-weight="400">Applicants will review suggested changes before using them.</text><text x="72" y="536" font-size="11" fill="#627580" font-weight="400">AI Safety · Harms → H2</text><text x="56" y="609" font-size="21" fill="#192c39" font-weight="700">Controls</text><text x="56" y="637" font-size="12" fill="#627580" font-weight="400">Permissions, data access, and safeguards</text><rect x="56" y="665" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="689" font-size="10" fill="#0b766c" font-weight="700">QUESTION</text><text x="72" y="713" font-size="14" fill="#192c39" font-weight="400">Could retrieval expose another applicant&#x27;s records?</text><text x="72" y="735" font-size="11" fill="#627580" font-weight="400">AI Safety · Controls → H3</text><text x="56" y="809" font-size="21" fill="#192c39" font-weight="700">Ownership</text><rect x="56" y="837" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="861" font-size="10" fill="#0b766c" font-weight="700">QUESTION</text><text x="72" y="885" font-size="14" fill="#192c39" font-weight="400">Who checks whether suggested edits remain accurate over time?</text><text x="72" y="907" font-size="11" fill="#627580" font-weight="400">AI Safety · Ownership → no supporting hypothesis yet</text><text x="56" y="981" font-size="13" fill="#192c39" font-weight="600">Scope · Evaluation · Response</text><text x="56" y="1007" font-size="12" fill="#627580" font-weight="400">No questions or assumptions recorded for these checkpoints.</text><path d="M56 1067H738" stroke="#dce4e6"/><text x="56" y="1091" font-size="10" fill="#627580" font-weight="400">Learning report · Intended product behavior, not proven product quality</text><text x="705" y="1091" font-size="11" fill="#0b766c" font-weight="700">04</text></svg>