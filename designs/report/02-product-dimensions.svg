<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">Product dimensions — report design</title><desc id="desc">A4 portrait report concept, with illustrative student-authored content.</desc><style>text {font-family: Arial, sans-serif;}</style><rect width="794" height="1123" fill="white"/><text x="56" y="43" font-size="10" fill="#0b766c" font-weight="700">AI PRODUCT TOOLKIT</text><text x="562" y="43" font-size="10" fill="#627580" font-weight="400">convincer.io · Team cais-26</text><path d="M56 59H738" stroke="#dce4e6"/><text x="56" y="111" font-size="30" fill="#192c39" font-weight="700">Product dimensions</text><text x="56" y="140" font-size="13" fill="#627580" font-weight="400">Scores summarize the intended experience; comments explain why.</text><text x="56" y="188" font-size="11" fill="#0b766c" font-weight="700">02 / ASSESSMENT OVERVIEW</text><rect x="56" y="214" width="682" height="370" rx="6" fill="#fafbfc" stroke="#e4eaed"/><g transform="translate(230,265)"><polygon points="166,0 312,106 257,278 75,278 20,106" fill="none" stroke="#d6e1e5"/><polygon points="166,50 264,121 227,236 105,236 68,121" fill="none" stroke="#d6e1e5"/><path d="M166 0V170L312 106M166 170L257 278M166 170L75 278M166 170L20 106" fill="none" stroke="#d6e1e5"/><polygon points="166,95 294,115 220,251 127,220 84,140" fill="#0b766c" fill-opacity=".12" stroke="#0b766c" stroke-width="2"/><text x="127" y="-18" font-size="11" fill="#627580" font-weight="400">Specialization</text><text x="319" y="110" font-size="11" fill="#627580" font-weight="400">Conversational</text><text x="253" y="302" font-size="11" fill="#627580" font-weight="400">Accessibility</text><text x="-3" y="302" font-size="11" fill="#627580" font-weight="400">Autonomy</text><text x="-92" y="111" font-size="11" fill="#627580" font-weight="400">Explainability</text></g><text x="78" y="557" font-size="12" fill="#0b766c" font-weight="400">● Intended profile</text><text x="275" y="557" font-size="12" fill="#627580" font-weight="400">Historical comparator: not selected</text><text x="56" y="630" font-size="11" fill="#0b766c" font-weight="700">PROFILE AT A GLANCE</text><text x="56" y="679" font-size="14" fill="#192c39" font-weight="600">Conversational interaction</text><text x="393" y="679" font-size="14" fill="#0b766c" font-weight="700">1.5/5</text><text x="56" y="703" font-size="13" fill="#627580" font-weight="400">Mostly guided; short clarifications</text><path d="M56 718H738" stroke="#dce4e6"/><text x="56" y="744" font-size="14" fill="#192c39" font-weight="600">Specialization</text><text x="393" y="744" font-size="14" fill="#0b766c" font-weight="700">4.5/5</text><text x="56" y="768" font-size="13" fill="#627580" font-weight="400">Focused on role-specific applications</text><path d="M56 783H738" stroke="#dce4e6"/><text x="56" y="809" font-size="14" fill="#192c39" font-weight="600">Autonomy</text><text x="393" y="809" font-size="14" fill="#0b766c" font-weight="700">2.0/5</text><text x="56" y="833" font-size="13" fill="#627580" font-weight="400">User reviews every proposed change</text><path d="M56 848H738" stroke="#dce4e6"/><text x="56" y="874" font-size="14" fill="#192c39" font-weight="600">Accessibility / audience breadth</text><text x="393" y="874" font-size="14" fill="#0b766c" font-weight="700">4.0/5</text><text x="56" y="898" font-size="13" fill="#627580" font-weight="400">Broad audience; usability assumptions remain</text><path d="M56 913H738" stroke="#dce4e6"/><text x="56" y="939" font-size="14" fill="#192c39" font-weight="600">Explainability</text><text x="393" y="939" font-size="14" fill="#0b766c" font-weight="700">3.0/5</text><text x="56" y="963" font-size="13" fill="#627580" font-weight="400">Explain suggested edits, not internal reasoning</text><path d="M56 978H738" stroke="#dce4e6"/><text x="56" y="1030" font-size="12" fill="#627580" font-weight="400">The next pages preserve the team&#x27;s full reasoning and open questions.</text><path d="M56 1067H738" stroke="#dce4e6"/><text x="56" y="1091" font-size="10" fill="#627580" font-weight="400">Learning report · Intended product behavior, not proven product quality</text><text x="705" y="1091" font-size="11" fill="#0b766c" font-weight="700">02</text></svg>