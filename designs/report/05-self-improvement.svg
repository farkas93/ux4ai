<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc"><title id="title">Self-Improvement — report design</title><desc id="desc">A4 portrait report concept, with illustrative student-authored content.</desc><style>text {font-family: Arial, sans-serif;}</style><rect width="794" height="1123" fill="white"/><text x="56" y="43" font-size="10" fill="#0b766c" font-weight="700">AI PRODUCT TOOLKIT</text><text x="562" y="43" font-size="10" fill="#627580" font-weight="400">convincer.io · Team cais-26</text><path d="M56 59H738" stroke="#dce4e6"/><text x="56" y="111" font-size="30" fill="#192c39" font-weight="700">Self-Improvement</text><text x="56" y="140" font-size="13" fill="#627580" font-weight="400">The loop, capability answers, explanations, and unresolved assumptions.</text><text x="56" y="187" font-size="11" fill="#0b766c" font-weight="700">05 / ONE LEARNING LOOP</text><rect x="56" y="215" width="682" height="103" rx="6" fill="#eaf4f1" stroke="none"/><text x="78" y="251" font-size="19" fill="#192c39" font-weight="400">Analyze rejected suggested edits and propose</text><text x="78" y="280" font-size="19" fill="#192c39" font-weight="400">clearer clarification prompts for the next cycle.</text><text x="56" y="357" font-size="11" fill="#0b766c" font-weight="700">WHAT THE TEAM BELIEVES AI CAN CONTRIBUTE</text><text x="56" y="401" font-size="11" fill="#0b766c" font-weight="700">01</text><text x="89" y="401" font-size="14" fill="#192c39" font-weight="600">Label or summarize operational evidence</text><text x="655" y="401" font-size="10" fill="#0b766c" font-weight="700">YES</text><text x="89" y="425" font-size="13" fill="#627580" font-weight="400">AI summarizes rejected edits; the team reviews the summaries.</text><path d="M56 477H738" stroke="#dce4e6"/><text x="56" y="499" font-size="11" fill="#0b766c" font-weight="700">02</text><text x="89" y="499" font-size="14" fill="#192c39" font-weight="600">Diagnose specific problems</text><text x="655" y="499" font-size="10" fill="#0b766c" font-weight="700">PARTLY</text><text x="89" y="523" font-size="13" fill="#627580" font-weight="400">Repeated rejection reasons may be visible, but diagnosis is</text><text x="89" y="543" font-size="13" fill="#627580" font-weight="400">still a team interpretation rather than an established capability.</text><path d="M56 575H738" stroke="#dce4e6"/><text x="56" y="597" font-size="11" fill="#0b766c" font-weight="700">03</text><text x="89" y="597" font-size="14" fill="#192c39" font-weight="600">Propose concrete changes</text><text x="655" y="597" font-size="10" fill="#0b766c" font-weight="700">YES</text><text x="89" y="621" font-size="13" fill="#627580" font-weight="400">AI can draft alternative prompt wording for review.</text><path d="M56 673H738" stroke="#dce4e6"/><text x="56" y="695" font-size="11" fill="#0b766c" font-weight="700">04</text><text x="89" y="695" font-size="14" fill="#192c39" font-weight="600">Evaluate candidates against a baseline</text><text x="655" y="695" font-size="10" fill="#0b766c" font-weight="700">UNKNOWN</text><text x="89" y="719" font-size="13" fill="#627580" font-weight="400">The team has not yet defined a repeatable comparison.</text><path d="M56 771H738" stroke="#dce4e6"/><text x="56" y="793" font-size="11" fill="#0b766c" font-weight="700">05</text><text x="89" y="793" font-size="14" fill="#192c39" font-weight="600">Apply and monitor changes over repeated cycles</text><text x="655" y="793" font-size="10" fill="#0b766c" font-weight="700">NO</text><text x="89" y="817" font-size="13" fill="#627580" font-weight="400">Changes are applied manually; repeated monitoring is not defined.</text><path d="M56 869H738" stroke="#dce4e6"/><rect x="56" y="914" width="682" height="86" rx="6" fill="#f4f7f7" stroke="none"/><text x="72" y="938" font-size="10" fill="#0b766c" font-weight="700">QUESTION</text><text x="72" y="962" font-size="14" fill="#192c39" font-weight="400">Do summaries reveal the real reason applicants reject edits?</text><text x="72" y="984" font-size="11" fill="#627580" font-weight="400">Self-Improvement → H4</text><text x="56" y="1030" font-size="12" fill="#627580" font-weight="400">No automated-loop level or implementation score is included.</text><path d="M56 1067H738" stroke="#dce4e6"/><text x="56" y="1091" font-size="10" fill="#627580" font-weight="400">Learning report · Intended product behavior, not proven product quality</text><text x="705" y="1091" font-size="11" fill="#0b766c" font-weight="700">05</text></svg>