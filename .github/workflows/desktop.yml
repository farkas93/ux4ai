name: Desktop native builds

on:
  push:
    branches: [main, 'feature/**', 'agent/**']
    paths: ['aipm_toolkit/**', 'packaging/**', 'alembic/**', 'baseline/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'build_support.py', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['aipm_toolkit/**', 'packaging/**', 'alembic/**', 'baseline/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'build_support.py', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: 'Sign and publish from the protected default branch'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.publish || github.ref_name == github.event.repository.default_branch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, os: windows, arch: x86_64, msvc: x64}
          - {runner: windows-11-arm, os: windows, arch: arm64, msvc: arm64}
          - {runner: macos-15-intel, os: macos, arch: x86_64}
          - {runner: macos-15, os: macos, arch: arm64}
          - {runner: ubuntu-22.04, os: linux, arch: x86_64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    environment: ${{ inputs.publish && 'desktop-release' || 'desktop-build' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.12.15'
          enable-cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.msvc }}
      - name: Linux GUI libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libgbm1 libnss3 libdbus-1-3 libfontconfig1 libfreetype6 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2-dev libxkbfile1 libwayland-server0 libopus0
      - name: Windows installer tooling
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./packaging/prepare_windows.ps1
      - name: Install locked native dependencies
        run: python packaging/ci_command.py 'Native dependency installation' -- uv sync --frozen --extra desktop --extra packaging --extra test
      - name: Core and hosted-web regressions
        run: python packaging/ci_command.py 'Platform source regressions' -- uv run --frozen --extra desktop --extra packaging --extra test pytest -q
      - name: Import macOS publisher certificate
        if: matrix.os == 'macos' && inputs.publish
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          test -n "$CERTIFICATE" && test -n "$SIGNING_IDENTITY"
          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"publisher.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/desktop-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/desktop-signing.keychain-db"
          security import "$RUNNER_TEMP/publisher.p12" -k "$RUNNER_TEMP/desktop-signing.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/desktop-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/desktop-signing.keychain-db"
          printf 'MACOS_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Import Windows publisher certificate
        if: matrix.os == 'windows' && inputs.publish
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE -or -not $env:CERT_PASSWORD) { throw 'Publisher certificate is required.' }
          $path = Join-Path $env:RUNNER_TEMP 'publisher.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE))
          "WINDOWS_CERT_FILE=$path" >> $env:GITHUB_ENV
          "WINDOWS_CERT_PASSWORD=$env:CERT_PASSWORD" >> $env:GITHUB_ENV
          "AIPM_SIGN_WINDOWS=1" >> $env:GITHUB_ENV
      - name: Build native bundle and installers
        run: python packaging/ci_command.py 'Native bundle build' -- uv run --frozen --extra desktop --extra packaging --extra test python packaging/build_desktop.py --expected-arch '${{ matrix.arch }}'
      - name: Linux native-window and frozen-runtime qualification
        if: matrix.os == 'linux'
        env:
          QT_QUICK_BACKEND: software
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu'
        run: python packaging/ci_command.py 'Linux frozen-window qualification' -- xvfb-run -a uv run --frozen --extra desktop --extra packaging --extra test python packaging/smoke_desktop.py --expected-arch '${{ matrix.arch }}' --profile "$RUNNER_TEMP/desktop-smoke"
      - name: Windows/macOS native-window and frozen-runtime qualification
        if: matrix.os != 'linux'
        run: python packaging/ci_command.py 'Native frozen-window qualification' -- uv run --frozen --extra desktop --extra packaging --extra test python packaging/smoke_desktop.py --expected-arch '${{ matrix.arch }}' --profile "$RUNNER_TEMP/desktop-smoke"
      - name: Notarize and staple macOS release
        if: matrix.os == 'macos' && inputs.publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for image in .artifacts/releases/*.dmg; do
            xcrun notarytool submit "$image" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
            xcrun stapler staple "$image"
          done
          uv run --frozen --extra packaging python packaging/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: .artifacts/releases/*
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.publish && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Publish verified immutable desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          gh release create "v$VERSION" artifacts/* --target "$GITHUB_SHA" --title "AI Product Toolkit $VERSION" --notes 'Native Windows, macOS and Linux desktop releases. Local SQLite storage; hosted web mode remains available.'
